spring.application.name=Gate-Way
server.port=8083

spring.cloud.discovery.enabled=true
spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=FILE-PROCESSING
spring.cloud.gateway.routes[0].uri=lb://FILE-PROCESSING
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/movies/**,/movies/search/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[1].id=AUTHENTICATION
spring.cloud.gateway.routes[1].uri=lb://AUTHENTICATION
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**,/api/friends/**,/user/tiers/**

spring.cloud.gateway.routes[2].id=COMMUNICATION-SERVICE
spring.cloud.gateway.routes[2].uri=lb://COMMUNICATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/meeting/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[3].id=FEATURES-SERVICE
spring.cloud.gateway.routes[3].uri=lb://FEATURES-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/map/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
